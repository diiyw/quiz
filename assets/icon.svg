<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7775F8"/>
      <stop offset="0.55" stop-color="#6753D9"/>
      <stop offset="1" stop-color="#392E83"/>
    </linearGradient>
    <linearGradient id="q" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DCD6FF"/>
      <stop offset="1" stop-color="#A99AFF"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF2A6"/>
      <stop offset="1" stop-color="#FFB96F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <circle cx="510" cy="460" r="430" fill="url(#glow)"/>
  <!-- Decorative bubbles -->
  <circle cx="220" cy="310" r="18" fill="#FFFFFF" opacity=".55"/>
  <circle cx="810" cy="330" r="12" fill="#FFFFFF" opacity=".6"/>
  <circle cx="790" cy="720" r="22" fill="#B9ADFF" opacity=".7"/>
  <circle cx="260" cy="750" r="11" fill="#FFFFFF" opacity=".45"/>
  <!-- Main Q -->
  <g filter="url(#shadow)">
    <circle cx="480" cy="455" r="245" fill="none" stroke="#342A80" stroke-width="122" opacity=".35" transform="translate(0 16)"/>
    <circle cx="480" cy="455" r="245" fill="none" stroke="url(#q)" stroke-width="118"/>
    <!-- Q tail -->
    <path d="M625 615 C665 660 700 704 762 758" fill="none" stroke="#342A80" stroke-width="126" stroke-linecap="round" opacity=".3" transform="translate(0 14)"/>
    <path d="M625 615 C665 660 700 704 762 758" fill="none" stroke="url(#tail)" stroke-width="112" stroke-linecap="round"/>
  </g>
  <!-- Inner soft highlight -->
  <path d="M315 330 C345 270 400 238 460 234" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity=".7"/>
  <!-- Cute face -->
  <g fill="#6856B7">
    <ellipse cx="420" cy="455" rx="17" ry="24"/>
    <ellipse cx="545" cy="455" rx="17" ry="24"/>
  </g>
  <path d="M447 510 Q480 540 513 510" fill="none" stroke="#8C76D5" stroke-width="13" stroke-linecap="round"/>
  <!-- Sparkles -->
  <g fill="#FFF1A8">
    <path d="M765 190 L783 237 L830 255 L783 273 L765 320 L747 273 L700 255 L747 237Z"/>
    <path d="M255 535 L267 568 L300 580 L267 592 L255 625 L243 592 L210 580 L243 568Z" opacity=".9"/>
  </g>
  <circle cx="690" cy="430" r="9" fill="#FFFFFF"/>
  <circle cx="335" cy="690" r="8" fill="#FFFFFF"/>
</svg>
