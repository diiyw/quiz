<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Quiz</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; background: #f7f6f3; color: #2f3437; font-family: sans-serif; font-size: 14px; }
body { padding: 28px 36px; overflow-y: auto; }
.header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; border-bottom: 1px solid #e5e3dd; }
.brand { font-size: 26px; font-weight: 700; letter-spacing: 3px; }
.caption { font-size: 12px; color: #73756e; letter-spacing: 1px; }
h1 { margin: 26px 0 8px; font-size: 30px; font-weight: 600; }
p { margin: 0; line-height: 1.6; }
.muted { color: #72766e; }
.drop { margin-top: 22px; padding: 26px; background: #ffffff; border: 1px solid #dedfd7; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.drop-title { font-size: 18px; font-weight: 600; margin-bottom: 7px; }
button { font-family: sans-serif; font-size: 14px; padding: 12px 20px; border: 1px solid #dedfd7; border-radius: 5px; color: #2f3437; background: #ffffff; cursor: pointer; }
button:hover { background: #efeee9; }
button:focus { outline: 2px solid #548061; }
button:disabled { opacity: .4; cursor: default; }
.primary { background: #2f3932; color: #ffffff; border-color: #2f3932; }
.primary:hover { background: #455447; }
.password { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
input { font-family: sans-serif; height: 36px; width: 240px; border: 1px solid #dedfd7; border-radius: 4px; background: #ffffff; color: #2f3437; padding: 8px 10px; }
input:focus { border-color: #548061; }
.small { font-size: 12px; }
.section-heading { margin-top: 26px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.section-title { font-size: 13px; color: #72766e; }
.state { color: #346538; font-size: 12px; }
.task { background: #eeefe9; padding: 18px 20px; border-radius: 6px; }
.task-name { font-size: 16px; font-weight: 600; margin-bottom: 8px; overflow-wrap: anywhere; }
#detail, #destination, #history, #menu-status { overflow-wrap: anywhere; }
#destination { margin-top: 6px; }
#history { margin-top: 14px; max-height: 120px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; line-height: 1.7; color: #626960; }
.actions { display: flex; gap: 10px; margin-top: 14px; }
.actions button { padding: 8px 14px; font-size: 12px; }
.footer { margin-top: 24px; padding-top: 18px; border-top: 1px solid #e5e3dd; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.footer button { padding: 8px 13px; font-size: 12px; }
#menu-status { margin-top: 10px; font-size: 12px; color: #72766e; }
.error { color: #9f2f2d; }
</style></head>
<body>
<div class="header"><span class="brand">QUIZ</span><span class="caption">本地解压 · 简单一点</span></div>
<h1>打开压缩包，就这么简单。</h1>
<p class="muted">解压到压缩包旁的同名文件夹，文件各归其位。</p>
<div class="drop"><div><p class="drop-title">将压缩包拖到这里</p><p class="muted small">ZIP · 7Z · RAR · TAR · GZ · BZ2 · XZ · ZSTD · LZ4 · LZIP</p></div><button id="choose" class="primary">选择文件并解压</button></div>
<div class="password"><label for="password" class="muted small">压缩包密码</label><input id="password" type="password" placeholder="可选，仅 7Z / RAR" autocomplete="off"><span class="muted small">可一次选择多个文件</span></div>
<div class="section-heading"><span class="section-title">解压任务</span><span id="state" class="state">准备就绪</span></div>
<div class="task"><p id="filename" class="task-name">等待选择压缩文件</p><p id="detail" class="muted small">例如：旅行照片.zip → 旅行照片/</p><p id="destination" class="muted small">同名文件夹已存在时自动编号，不覆盖原有文件。</p></div>
<div class="actions"><button id="cancel" disabled>取消全部</button><button id="open" disabled>打开解压文件夹</button></div>
<div id="history"></div>
<div class="footer"><div><p>从右键菜单，直接解压。</p><p class="muted small">安装一次，之后选中压缩包即可使用。</p></div><div><button id="install">安装右键菜单</button> <button id="uninstall">移除菜单</button></div></div>
<p id="menu-status">仅为当前用户安装，无需管理员权限。</p>
</body></html>
